name: strefa-treningow
x-api: &api
  build: ./backend
  env_file: .env
  environment:
    S3_ENDPOINT: http://storage:8333
    OTEL_SERVICE_NAME: strefa-api
    LOG_FILE: /var/log/strefa/api.log
  volumes: [applogs:/var/log/strefa]
  depends_on:
    db: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: strefa
      POSTGRES_USER: strefa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U strefa -d strefa']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    command: migrate
    restart: 'no'
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ['127.0.0.1:${API_PORT:-18080}:8080']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *api
    command: worker
    environment:
      S3_ENDPOINT: http://storage:8333
      OTEL_SERVICE_NAME: strefa-worker
      LOG_FILE: /var/log/strefa/worker.log
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage: {condition: service_started}
  seed:
    <<: *api
    command: seed
    profiles: [tools]
    restart: 'no'
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./frontend
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
      NUXT_PUBLIC_MAPTILER_KEY: ${NUXT_PUBLIC_MAPTILER_KEY:-${MAPTILER_KEY}}
      NUXT_PUBLIC_THEME_SEED: ${NUXT_PUBLIC_THEME_SEED}
    ports: ['127.0.0.1:${WEB_PORT:-3100}:3000']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 10
  storage:
    image: chrislusf/seaweedfs:4.17
    command: 'mini -dir=/data'
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes: [s3data:/data]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    profiles: [production]
    ports: ['80:80', '443:443', '443:443/udp']
    environment: {DOMAIN: '${DOMAIN}'}
    volumes: ['./infra/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddydata:/data', 'caddyconfig:/config']
    depends_on: [web]
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    profiles: [monitoring]
    command: ['--config=/etc/otel.yaml']
    volumes: ['./infra/observability/otel.yaml:/etc/otel.yaml:ro', 'applogs:/var/log/strefa:ro']
    user: '0'
    depends_on: [tempo, loki]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: ['./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro', './infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro', 'promdata:/prometheus']
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.8.2
    profiles: [monitoring]
    command: ['-config.file=/etc/tempo.yaml']
    volumes: ['./infra/observability/tempo.yaml:/etc/tempo.yaml:ro', 'tempodata:/var/tempo']
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.5
    profiles: [monitoring]
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes: [lokidata:/loki]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:${GRAFANA_PORT:-3101}:3000']
    volumes: ['./infra/observability/datasources.yaml:/etc/grafana/provisioning/datasources/strefa.yaml:ro', './infra/observability/dashboards.yaml:/etc/grafana/provisioning/dashboards/strefa.yaml:ro', './infra/observability/dashboard.json:/var/lib/grafana/dashboards/strefa.json:ro', 'grafanadata:/var/lib/grafana']
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    volumes: ['./infra/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro']
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    command: ['--collector.textfile.directory=/textfile']
    volumes: ['./backups/metrics:/textfile:ro']
    restart: unless-stopped
volumes:
  applogs:
  pgdata:
  s3data:
  caddydata:
  caddyconfig:
  promdata:
  tempodata:
  lokidata:
  grafanadata:
